name: Testes P2P (Linux)
on:
  push:
    branches: [main, revisao-teste-malha-completa]
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Testes unitarios
        run: python -m unittest discover -v
      - name: Testes funcionais (malha de seis pares)
        run: python -u validar_funcional.py --out validacao_github
      - name: Diagnostico dos testes funcionais
        if: failure()
        shell: bash
        run: |
          echo '=== Consoles dos peers ==='
          find validacao_github -name '*_console.txt' -type f -print -exec tail -n 60 {} \; 2>/dev/null || true
          echo '=== Transferencias por par ==='
          python -c "import json,pathlib,collections; d=pathlib.Path('validacao_github/malha_completa'); c=collections.Counter(); [(c.update(['-'.join(sorted((e.get('remote','?'),p)))]) if e.get('event')=='BLOCK_RECEIVED' else None) for p in 'BCD' for path in [d / (p+'.jsonl')] if path.exists() for line in path.read_text(encoding='utf-8').splitlines() for e in [json.loads(line)]]; [print(pair, c[pair]) for pair in ('A-B','A-C','A-D','B-C','B-D','C-D')]"
      - name: Matriz de experimentos
        run: python executar_testes.py --out resultados_github
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidencias-execucao-p2p
          path: |
            validacao_github/
            resultados_github/
          if-no-files-found: ignore
