name: Publicar PDF final
on:
  push:
    branches: [main]
    paths:
      - 'RELATORIO_FINAL.md'
      - 'scripts/gerar_relatorio_pdf.py'
      - '.github/workflows/publicar-relatorio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab
      - run: python scripts/gerar_relatorio_pdf.py
      - name: Publicar PDF versionado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Relatorio_Final_TP2_P2P_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: publica PDF final validado [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-final-pdf
          path: Relatorio_Final_TP2_P2P_2026.pdf
